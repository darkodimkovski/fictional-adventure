name: CI-CD workflow

permissions:
  id-token: write
  contents: read

on:
    push:
        branches:
            - main
            - develop
    pull_request: 
        branches: 
            - main
jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                node-version: latest
            - run: npm ci
            - run: npm run build
            - run: npm test
            - name: Upload build artifact
              uses: actions/upload-artifact@v4
              with:
                name: deployment-artifact
                path: out/
                
    publish:
        needs: build-and-test
        environment: test

        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
        steps:
            - uses: actions/checkout@v3
            - uses: azure/login@v3
              with:
                name: deployment-artifact
                path: out/

            - name: deploy to azure web app
              uses: azure/webapps-deploy@v3
              with:
                app-name: next
                package: out/
